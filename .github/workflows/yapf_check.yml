name: YAPF Formatting Check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: run YAPF to test if python code is correctly formatted
      uses: AlexanderMelde/yapf-action@v2.0
      with:
        args: --verbose
